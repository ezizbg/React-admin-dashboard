<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Admin Dashboard</title>
    <script>
      // spa-github-pages: restore path from ?p= query param set by 404.html
      (function () {
        var search = window.location.search;
        if (search[1] === 'p' && search[2] === '=') {
          var path = search.slice(3).split('&q=');
          var decoded = (path[0] || '').replace(/~and~/g, '&');
          var query = path[1] ? '?' + path[1].replace(/~and~/g, '&') : '';
          window.history.replaceState(
            null, null,
            window.location.pathname + decoded + query + window.location.hash
          );
        }
      })();
    </script>
    <script type="module" crossorigin src="/React-admin-dashboard/assets/index-uaAXmYk_.js"></script>
    <link rel="stylesheet" crossorigin href="/React-admin-dashboard/assets/index-BUnfvmnL.css">
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: #f6f8f7; color: #202427;">
        <div style="max-width: 520px; padding: 28px; border: 1px solid #dfe6e2; border-radius: 8px; background: #ffffff;">
          <strong style="display: block; margin-bottom: 8px; font-size: 20px;">SaaS Admin Dashboard</strong>
          <p style="margin: 0; color: #68716d; line-height: 1.5;">
            React-приложение загружается через Vite. Запустите проект командой <code>npm run dev</code>
            и откройте локальный адрес из терминала.
          </p>
        </div>
      </div>
    </div>
    <noscript>Для работы dashboard нужен JavaScript.</noscript>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>SaaS Admin Dashboard</title>
    <script>
      // spa-github-pages redirect: encode the current path into the query string
      // pathSegmentsToKeep=1 preserves /React-admin-dashboard/ base path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
